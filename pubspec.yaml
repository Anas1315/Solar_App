name: smart_energy_controller
description: Smart Energy Controller - Complete Power Management System
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  shimmer: ^3.0.0

  # State Management
  provider: ^6.1.1

  # Networking
  http: ^1.1.0
  socket_io_client: ^2.0.3
  connectivity_plus: ^5.0.2

  # Local Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # Charts & Visualization
  fl_chart: ^0.66.0

  # Notifications
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.2

  # Utilities
  intl: ^0.18.1
  equatable: ^2.0.5
  url_launcher: ^6.2.4
  package_info_plus: ^5.0.1
  share_plus: ^7.2.1
  home_widget: ^0.9.1
  google_sign_in: ^6.2.2
  curved_navigation_bar: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
